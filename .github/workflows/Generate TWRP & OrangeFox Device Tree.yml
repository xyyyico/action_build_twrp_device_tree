name: Generate TWRP & OrangeFox Device Tree
on:
  workflow_dispatch:
    inputs:
      LIBRARY_NAME:
        description: 'Device Tree Library Name'
        required: true
        default: 'Twrp_OrangeFox_Device'
      IMG_URL:
        description: 'URL to recovery/boot image'
        required: true
        default: 'https://github.com/momo54181/action_build_twrp_device_tree/raw/main/recovery.img'
      TARGET_BRANCH:
        description: 'TWRP/OrangeFox Base Branch (twrp-12.1/orangefox-12.1 etc)'
        required: true
        default: 'twrp-12.1'

jobs:
  generate-device-tree:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up full build environment
        run: >
          sudo apt-get update -y &&
          sudo apt-get install -y python3 python3-pip cpio wget zip unzip git liblz4-tool lzop bc rsync file dos2unix

      - name: Install twrpdtgen
        run: >
          pip3 install --upgrade pip &&
          pip3 install --upgrade twrpdtgen pycryptodome

      - name: Download recovery image
        run: >
          wget -O recovery.img "${{ github.event.inputs.IMG_URL }}" &&
          file recovery.img

      - name: Generate base TWRP Device Tree
        run: >
          mkdir -p device_tree_output &&
          python3 -m twrpdtgen -o device_tree_output recovery.img

      - name: Adapt for OrangeFox Recovery
        run: |
          cd device_tree_output
          # 生成橙狐配置文件
          echo "# OrangeFox Prebuilt Config" > fox_prebuilt.mk
          echo "FOX_BUILD_TYPE := Official" >> fox_prebuilt.mk
          echo "FOX_TARGET_DEVICE := \$(DEVICE)" >> fox_prebuilt.mk
          echo "FOX_USE_TWRP_DT := true" >> fox_prebuilt.mk
          echo "FOX_ENABLE_MAGISK_BOOT := true" >> fox_prebuilt.mk
          echo "FOX_REMOVE_DUPLICATE_PROP := true" >> fox_prebuilt.mk
          echo "FOX_USE_LZ4 := true" >> fox_prebuilt.mk

          echo "# OrangeFox Version Info" > fox_version.mk
          echo "FOX_VERSION := R11.1" >> fox_version.mk
          echo "FOX_BUILD_DATE := \$(shell date +%Y%m%d)" >> fox_version.mk
          echo "FOX_MAINTAINER := Auto-Generated" >> fox_version.mk

          # 创建橙狐RC目录与文件
          mkdir -p recovery/root/orangefox
          echo "# OrangeFox Init RC" > recovery/root/orangefox/orangefox.rc

          # 追加新版TWRP编译参数
          echo "TW_NEW_ION_HEAP := true" >> BoardConfig.mk
          echo "TW_TARGET_USES_QCOM_BSP := false" >> BoardConfig.mk
          echo "TW_INCLUDE_NTFS_3G := true" >> BoardConfig.mk
          echo "TW_NO_SCREEN_BLANK := true" >> BoardConfig.mk
          echo "TW_HAS_DOWNLOAD_MODE := true" >> BoardConfig.mk
          echo "OF_MAINTAINER := Auto" >> BoardConfig.mk

          # 仅处理存在的文件，忽略不存在的通配符
          dos2unix *.mk 2>/dev/null || true
          dos2unix recovery/root/orangefox/orangefox.rc 2>/dev/null || true

          # 统一权限
          find . -type f -exec chmod 644 {} \;
          find . -type d -exec chmod 755 {} \;
          cd ..

      - name: Compress Device Tree
        run: zip -r "TWRP_OrangeFox_DT_${{ github.run_number }}.zip" device_tree_output/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: TWRP_OrangeFox_DT_${{ github.run_number }}.zip
          name: TWRP_OrangeFox_DeviceTree_${{ github.run_number }}
          tag_name: dt-of-${{ github.run_number }}
          body: |
            ### 设备树信息
            - 适配：最新版 TWRP + 橙狐 OrangeFox Recovery
            - 基础分支：${{ github.event.inputs.TARGET_BRANCH }}
            - 构建编号：${{ github.run_number }}
            - 源镜像：${{ github.event.inputs.IMG_URL }}
            - 特性：双Rec通用配置、新版TWRP兼容、橙狐默认配置
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
