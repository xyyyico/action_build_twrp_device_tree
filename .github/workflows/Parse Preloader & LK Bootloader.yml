name: Parse Preloader & LK Bootloader
on:
  workflow_dispatch:
    inputs:
      FIRMWARE_URL:
        description: 固件/镜像下载地址(包含preloader/lk)
        required: true
        default: 'https://example.com/firmware.zip'
      IS_MTK:
        description: 是否联发科MTK固件(true/false)
        required: true
        default: 'true'

jobs:
  parse-bl:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OUTPUT_DIR: bl_parse_output
      GIT_TERMINAL_PROMPT: 0
      GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=no
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y git python3 python3-pip python3-venv binwalk cpio unzip wget libusb-1.0-0-dev build-essential

      # 创建Python虚拟环境，解决权限与包隔离
      - name: Create & activate venv
        run: |
          python3 -m venv pyenv
          source pyenv/bin/activate
          pip install --upgrade pip setuptools wheel

      # 源码安装 mtkclient
      - name: Install mtkclient from source
        run: |
          source pyenv/bin/activate
          git clone --depth 1 https://github.com/bkerler/mtkclient.git
          cd mtkclient
          pip install .
          cd ..

      # 源码安装 lkparse
      - name: Install lkparse from source
        run: |
          source pyenv/bin/activate
          git clone --depth 1 https://github.com/LineageOS/lkparse.git
          cd lkparse
          pip install .
          cd ..

      # 安装 twrpdtgen 指定版本
      - name: Install twrpdtgen
        run: |
          source pyenv/bin/activate
          pip install --no-cache-dir twrpdtgen==2.2.0

      # 下载固件包
      - name: Download firmware
        run: |
          wget --retry-connrefused --waitretry=3 -O firmware.zip ${{ github.event.inputs.FIRMWARE_URL }}
          mkdir -p firmware
          unzip -q firmware.zip -d firmware/
          ls -la firmware/

      - name: Create output dir
        run: mkdir -p $OUTPUT_DIR

      # 解析 MTK Preloader
      - name: Parse Preloader
        if: github.event.inputs.IS_MTK == 'true'
        run: |
          source pyenv/bin/activate
          find firmware -name "preloader*.bin" -type f > preloader_list.txt
          while read bl_file; do
            if [ -n "$bl_file" ]; then
              echo "Parsing $bl_file"
              mtkclient --dump "$bl_file" >> $OUTPUT_DIR/preloader_dump.log 2>&1
              cp "$bl_file" $OUTPUT_DIR/
            fi
          done < preloader_list.txt

      # 解析 LK
      - name: Parse LK
        run: |
          source pyenv/bin/activate
          find firmware -name "lk.bin" -o -name "lk.img" -type f > lk_list.txt
          while read lk_file; do
            if [ -n "$lk_file" ]; then
              echo "Parsing $lk_file"
              lkparse "$lk_file" >> $OUTPUT_DIR/lk_dump.log 2>&1
              binwalk "$lk_file" >> $OUTPUT_DIR/lk_binwalk.log 2>&1
              cp "$lk_file" $OUTPUT_DIR/
            fi
          done < lk_list.txt

      # 打包结果
      - name: Package files
        run: |
          cd $OUTPUT_DIR
          zip -r ../BL_Parse_${{ github.run_number }}.zip .
          cd ..

      # 发布到 Release
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: BL_Parse_${{ github.run_number }}.zip
          name: Preloader_LK_Parse_${{ github.run_number }}
          tag_name: bl-parse-${{ github.run_number }}
          body: |
            自动解析 Preloader + LK 固件包
            固件地址: ${{ github.event.inputs.FIRMWARE_URL }}
            MTK 模式: ${{ github.event.inputs.IS_MTK }}
            构建编号: ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
